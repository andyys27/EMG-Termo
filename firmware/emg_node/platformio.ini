; Nodo EMG: ESP32-S3 SuperMini
; Se usa el fork "pioarduino" para tener Arduino-ESP32 3.x (ESP-IDF 5.x).
; El driver del ADS131M04 usa attachInterruptArg y la API LEDC de IDF.
; Fijar la versión del platform a la que se use finalmente en el proyecto.
[platformio]
default_envs = bringup

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1          ; placa genérica S3; el SuperMini no tiene definición propia
board_build.flash_size = 4MB        ; TODO: verificar flash/PSRAM de su variante del SuperMini
board_upload.flash_size = 4MB
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Serial por USB nativo
    -Wall
    -Wextra

; Bring-up del ADS131M04: verifica registros, mide ruido (entradas en corto) y estadísticas por Serial (sin Wi-Fi)
[env:bringup]
build_flags =
    ${env.build_flags}
    -DBRINGUP_MODE=1

; Firmware completo (Wi-Fi + comandos): pendiente
[env:emg_node]
build_flags =
    ${env.build_flags}
    -DNODE_MODE=1