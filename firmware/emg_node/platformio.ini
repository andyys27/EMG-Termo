; Nodo EMG — ESP32-C3 SuperMini (ESP32-C3FH4: 4 MB flash, sin PSRAM, RISC-V un núcleo).
; Plataforma pioarduino (Arduino-ESP32 3.x sobre ESP-IDF 5) para el driver adc_continuous.
;
; Compilar:  pio run
; Cargar:    pio run -t upload      (si no aparece el puerto: mantener BOOT, conectar, soltar)
; Monitor:   pio device monitor
; Prueba del validador en la PC (sin placa):
;   g++ -std=c++17 -Wall -Iinclude test/test_validator_host.cpp -o /tmp/tv && /tmp/tv

[env:supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

; La SuperMini tiene 4 MB de flash 
board_upload.flash_size = 4MB
board_build.partitions = default.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DARDUINO_USB_MODE=1            ; USB Serial/JTAG nativo de la C3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
    -Wall

; test/test_validator_host.cpp se compila con g++ en la PC, no con `pio test`.
test_ignore = *
